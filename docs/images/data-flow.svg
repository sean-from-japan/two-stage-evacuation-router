<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Data flow between the modules of two-stage-evacuation-router</title>
  <desc id="desc">A scenario document enters through the CLI or the Flask adapter, is parsed by io.py, is planned by a pure core of geometry, graph and planner modules, and leaves as either a text report or the canonical JSON document shared by both transports.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .io { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .adapter { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .core { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .zone { fill: #f6f8fa; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .name { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .sub { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .edge { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .zonelabel { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8250df; }
    .heading { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .note { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .flow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .call { stroke: #8250df; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowp); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="680"/>
  <text class="heading" x="30" y="34">Data flow — what each file receives and returns</text>

  <rect class="io" x="70" y="58" width="280" height="54" rx="6"/>
  <text class="name" x="210" y="80" text-anchor="middle">examples/synthetic_city.json</text>
  <text class="sub" x="210" y="98" text-anchor="middle">scenario document on disk</text>

  <rect class="io" x="550" y="58" width="280" height="54" rx="6"/>
  <text class="name" x="690" y="80" text-anchor="middle">POST /routes</text>
  <text class="sub" x="690" y="98" text-anchor="middle">the same document as a JSON body</text>

  <path class="flow" d="M 210 112 L 210 152"/>
  <path class="flow" d="M 690 112 L 690 152"/>

  <rect class="adapter" x="70" y="154" width="280" height="54" rx="6"/>
  <text class="name" x="210" y="176" text-anchor="middle">cli.py</text>
  <text class="sub" x="210" y="194" text-anchor="middle">arguments, exit codes 0 / 2 / 3</text>

  <rect class="adapter" x="550" y="154" width="280" height="54" rx="6"/>
  <text class="name" x="690" y="176" text-anchor="middle">api.py</text>
  <text class="sub" x="690" y="194" text-anchor="middle">Flask, status 200 / 422 / 400</text>

  <path class="flow" d="M 210 208 L 210 232 L 340 232 L 340 256"/>
  <path class="flow" d="M 690 208 L 690 232 L 560 232 L 560 256"/>

  <rect class="panel" x="250" y="258" width="400" height="62" rx="6"/>
  <text class="name" x="450" y="282" text-anchor="middle">io.py</text>
  <text class="sub" x="450" y="302" text-anchor="middle">scenario_from_dict — parse, validate, ScenarioFormatError</text>

  <path class="flow" d="M 450 320 L 450 366"/>
  <text class="edge" x="462" y="345">Scenario (frozen dataclass)</text>

  <rect class="zone" x="60" y="368" width="780" height="176" rx="8"/>
  <text class="zonelabel" x="76" y="390">pure core — no file access, no network, no transport, no rendering</text>

  <rect class="core" x="80" y="404" width="200" height="58" rx="6"/>
  <text class="name" x="180" y="428" text-anchor="middle">geometry.py</text>
  <text class="sub" x="180" y="447" text-anchor="middle">project_hazards</text>

  <rect class="core" x="350" y="404" width="200" height="58" rx="6"/>
  <text class="name" x="450" y="428" text-anchor="middle">planner.py</text>
  <text class="sub" x="450" y="447" text-anchor="middle">plan_evacuation</text>

  <rect class="core" x="620" y="404" width="200" height="58" rx="6"/>
  <text class="name" x="720" y="428" text-anchor="middle">graph.py</text>
  <text class="sub" x="720" y="447" text-anchor="middle">Graph, dijkstra</text>

  <path class="call" d="M 284 437 L 346 437"/>
  <text class="edge" x="315" y="427" text-anchor="middle">hazard set</text>
  <path class="call" d="M 554 437 L 616 437"/>
  <text class="edge" x="585" y="427" text-anchor="middle">subgraphs</text>

  <text class="note" x="450" y="500" text-anchor="middle">every box above exchanges the frozen dataclasses defined in model.py</text>
  <text class="note" x="450" y="522" text-anchor="middle">stage one leaves the hazard, stage two reaches a shelter, the pair is chosen on total distance</text>

  <path class="flow" d="M 450 544 L 450 578 L 210 578 L 210 600"/>
  <path class="flow" d="M 450 544 L 450 578 L 690 578 L 690 600"/>
  <text class="edge" x="462" y="566">PlanResult</text>

  <rect class="panel" x="70" y="602" width="280" height="54" rx="6"/>
  <text class="name" x="210" y="624" text-anchor="middle">cli.format_text</text>
  <text class="sub" x="210" y="642" text-anchor="middle">human-readable report</text>

  <rect class="panel" x="550" y="602" width="280" height="54" rx="6"/>
  <text class="name" x="690" y="624" text-anchor="middle">io.plan_result_to_json</text>
  <text class="sub" x="690" y="642" text-anchor="middle">canonical JSON, used by both transports</text>
</svg>
