[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-evacuation-router"
version = "0.1.0"
description = "Deterministic two-stage evacuation routing on synthetic road graphs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sean-from-japan"}]
dependencies = []

[project.optional-dependencies]
api = [
  "flask==3.1.3",
]
dev = [
  "flask==3.1.3",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[project.scripts]
evacuation-route = "two_stage_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["two_stage_router"]
